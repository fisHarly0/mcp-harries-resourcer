<body><article><h1>中文编码资料</h1>
<p>这是一份用于验证网页字符编码的技术资料。正文、标题和链接中的中文应当保留原来的文字，不能仅仅因为服务器漏写响应头，就把整篇资料变成无法阅读的乱码。</p>
<p>读取原始字节后，需要根据网页提供的声明选择解码方式。纯文本和 Markdown 应共享同一份正确解码的内容，后续翻页与缓存读取也不应改变文字。</p>
<h2>代码示例</h2><pre><code class="language-python">def welcome():
    print("中文资料读取成功")
</code></pre>
<p>请参考<a href="/guide">中文参考文档</a>，检查引用文字是否与页面一致。编码诊断只记录解码过程，不用于判断资料的事实准确性。</p>
